urls {
    home = "https://practice-automation.com/"
    blog = "https://automatenow.io/"
    calendars = "https://practice-automation.com/calendars/"
    modals = "https://practice-automation.com/modals/"
    ads = "https://practice-automation.com/ads/"
    formFields = "https://practice-automation.com/form-fields/"
    youtube {
        calendars = "https://www.youtube.com/watch?v=m7yTy2yCQzI"
        modals = "https://www.youtube.com/watch?v=FZBGRjv0pqU"
        ads = "https://www.youtube.com/watch?v=FZBGRjv0pqU"
    }
}

runtime {
    browser = "chrome"
    remoteUrl = ""
    browserBinary = ""
    headless = true
    timeoutSeconds = 15
    pageLoadTimeoutSeconds = 40
}

calendar {
    heading = "Calendars"
    formatHint = "YYYY-MM-DD"
    firstDay = 1
    requiredLastDay = 28
    maxDays = 31
    navigationSteps = 2
    validDates = ["2024-02-29", "2026-01-01", "2099-12-31"]
    invalidDates = ["31/12/2026", "2025-02-30", "not-a-date", "2026-13-01"]
}

modals {
    heading = "Modals"
    role = "dialog"
    simple {
        title = "Simple Modal"
        text = "simple modal"
    }
    form {
        title = "Modal Containing A Form"
        valid {
            name = "Finalist"
            email = "finalist@example.com"
            message = "Automation matters"
        }
        invalid {
            name = "Finalist"
            email = "invalid-email"
            message = "Negative check"
        }
    }
}

ads {
    heading = "Ads"
    countdownRegex = ".*5.*4.*3.*2.*1.*"
    title = "Hi"
    message = "I am an ad"
    role = "dialog"
    activeClass = "pum-active"
}

formFields {
    heading = "Form Fields"
    automationTools = ["Selenium", "Playwright", "Cypress", "Appium", "Katalon Studio"]
    separator = ", "
    inputValues {
        numbers = "1234567890"
        doubleSpace = "12  34"
        tripleSpace = "1   2   3"
    }
    password = "S3cret  2026"
    email = "finalist@example.com"
    drinks = ["Water", "Coffee", "Ctrl-Alt-Delight"]
    colors = ["Red", "Blue", "Yellow", "Green", "#FFC0CB"]
    automationOptions = ["default", "yes", "no", "undecided"]
    automationSelection = "yes"
    alertText = "Message received!"
}
