image: maven:3.9.11-eclipse-temurin-17

stages:
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

cache:
  key: maven
  paths:
    - .m2/repository

ui-tests:
  stage: test
  parallel:
    matrix:
      - BROWSER: [chrome, firefox, edge]
  before_script:
    - apt-get update
    - |
      if [ "$BROWSER" = "firefox" ]; then
        apt-get install --yes --no-install-recommends firefox-esr
      elif [ "$BROWSER" = "edge" ]; then
        apt-get install --yes --no-install-recommends ca-certificates curl gpg
        curl --silent https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --output /usr/share/keyrings/microsoft-edge.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list
        apt-get update
        apt-get install --yes --no-install-recommends microsoft-edge-stable
      else
        apt-get install --yes --no-install-recommends chromium || apt-get install --yes --no-install-recommends chromium-browser
      fi
  script:
    - mvn $MAVEN_CLI_OPTS clean test -Dheadless=true -Dbrowser=$BROWSER
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/allure-results/
      - target/surefire-reports/

allure-pages:
  stage: deploy
  needs:
    - job: ui-tests
      artifacts: true
  script:
    - mvn $MAVEN_CLI_OPTS allure:report
    - rm -rf public
    - mv target/site/allure-maven-plugin public
    - test -f public/index.html
  artifacts:
    paths:
      - public/
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
